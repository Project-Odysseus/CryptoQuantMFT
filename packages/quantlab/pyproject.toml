[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "A portable research-to-live lab for systematic multi-asset strategies: one engine, causal by construction, statistics-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved by the author" }
# Core dependencies only (plan 0.2). Anything else is an optional extra, imported lazily.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]
stats = ["statsmodels>=0.14", "arch>=7"]
calendars = ["exchange_calendars>=4.5"]  # exact exchange holidays (weekdays without it)
parquet = ["pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantlab = ["validation/standards/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
