# Example portfolio: the trend rules that held up in research, on the Kraken BTC and ETH perpetuals.
# Check it:     python main.py --portfolio-check config/portfolio.example.toml
# Backtest it:  python scripts/research/portfolio_backtest.py config/portfolio.example.toml
# Every field is described in docs/portfolio_plan.md, section 5. Shares are of portfolio equity (0.5 = 50%).

[portfolio]
name = "trend-core"
base_currency = "USD"
initial_equity = 10000
rebalance_band = 0.02            # skip trades smaller than 2% of equity (closing and flipping always trade)
allocation = "equal"             # fixed | equal | inverse_vol. Sleeves below are already volatility-sized, so equal
allocation_lookback_days = 90    # used by inverse_vol
allocation_refit_days = 30

[risk]
max_gross_exposure = 1.5         # sum of |weights| over all instruments
max_net_exposure = 1.0           # |sum of weights|
max_instrument_weight = 1.0      # per instrument, after netting the sleeves on it
max_venue_exposure = { kraken_futures = 1.5 }
max_drawdown = 0.40              # from the equity peak: flatten everything and stay flat (a kill; the backtest's worst is ~33%)
# drawdown_derisk_start = 0.25   # optional: scale all targets down linearly from this drawdown...
# drawdown_derisk_floor = 0.5    # ...to this size just before max_drawdown. Off here: it lowered Sharpe in research
daily_loss_limit = 0.06          # past this loss within a UTC day, positions may only shrink until the next day
stale_after_bars = 2

[instruments."kraken_futures:BTC/USD"]
kind = "perp"
max_leverage = 2.0
slippage_bps = 5

[instruments."kraken_futures:ETH/USD"]
kind = "perp"
max_leverage = 2.0
slippage_bps = 5

[[sleeves]]
id = "btc_ma_1d"
instrument = "kraken_futures:BTC/USD"
interval = "1d"
strategy = "moving_average_crossover"
params = { short_window = 4, long_window = 48 }
long_only = true
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "eth_ma_1d"
instrument = "kraken_futures:ETH/USD"
interval = "1d"
strategy = "moving_average_crossover"
params = { short_window = 4, long_window = 48 }
long_only = true
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "btc_keltner_ls"
instrument = "kraken_futures:BTC/USD"
interval = "1d"
strategy = "keltner_breakout"
params = { window = 40, atr_multiplier = 2.0 }
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "eth_keltner_ls"
instrument = "kraken_futures:ETH/USD"
interval = "1d"
strategy = "keltner_breakout"
params = { window = 40, atr_multiplier = 2.0 }
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "btc_ma_4h"
instrument = "kraken_futures:BTC/USD"
interval = "4h"
strategy = "moving_average_crossover"
params = { short_window = 8, long_window = 96 }
long_only = true
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }
