# Example portfolio: the trend rules that held up in research, on the Kraken BTC and ETH perpetuals.
# Check it:     python main.py --portfolio-check config/portfolio.example.toml
# Backtest it:  python scripts/research/portfolio_backtest.py config/portfolio.example.toml
# Every field is described in docs/portfolio_plan.md, section 5. Shares are of portfolio equity (0.5 = 50%).

[portfolio]
name = "trend-core"
base_currency = "USD"
initial_equity = 10000
rebalance_band = 0.02            # skip trades smaller than 2% of equity (closing and flipping always trade)
scale = 1.0                      # sizes the whole book; see scripts/research/risk_budget.py (0.38 fits a 20% drawdown limit with a 1.5x margin)
allocation = "equal"             # fixed | equal | inverse_vol | risk_parity | hrp. Sleeves below are already volatility-sized, so equal
allocation_lookback_days = 90    # used by inverse_vol, risk_parity and hrp
allocation_refit_days = 30

[risk]
max_gross_exposure = 1.5         # sum of |weights| over all instruments
max_net_exposure = 1.0           # |sum of weights|
max_instrument_weight = 1.0      # per instrument, after netting the sleeves on it
max_venue_exposure = { kraken_futures = 1.5 }
max_drawdown = 0.40              # from the equity peak: flatten everything and stay flat (a kill; the backtest's worst is ~33%)
# drawdown_derisk_start = 0.25   # optional: scale all targets down linearly from this drawdown...
# drawdown_derisk_floor = 0.5    # ...to this size just before max_drawdown. Off here: it lowered Sharpe in research
daily_loss_limit = 0.06          # past this loss within a UTC day, positions may only shrink until the next day
stale_after_bars = 2
rejection_cooldown_after = 3      # this many rejected orders in a row on one instrument: only reductions on it for...
rejection_cooldown_hours = 24     # ...this long, then one more try (0 for _after switches it off)
# exchange_stop_pct = 0.20        # live only: a reduce-only stop resting on the exchange per position (runbook, "Exchange stops")
# max_gross_notional = 3000      # the most money the book may hold in positions (base currency); required for --runtime live

# Correlation-aware limits, from the book's risk model (src/portfolio/risk_model.py: an EWMA covariance of the instruments'
# 4h returns). All off unless set. BTC and ETH move together, so 1.0x BTC plus 0.5x ETH is ~1.5x of one bet, not two.
# benchmark = "kraken_futures:BTC/USD"   # betas are measured against it (reports default to the book's BTC instrument)
# max_beta_exposure = 1.2          # |sum of weight x beta|: the book in benchmark terms, at most 1.2x of equity
# max_portfolio_vol = 0.45         # the book's annual volatility with correlations floored at stress_correlation; scales down only
# stress_correlation = 0.9         # crash correlations (0 = use the estimated ones)
# vol_halflife_days = 20           # how fast the risk model forgets
# max_average_correlation = 0.8    # alert (nothing is resized) when the sleeves' returns correlate above this on average...
# min_effective_bets = 1.5         # ...or are worth fewer independent bets than this, over correlation_lookback_days (90)

# Caps per instrument group: tag instruments with group = "<name>" in their [instruments] table.
# [risk.groups.alts]
# max_gross = 0.8                  # sum of |weights| in the group
# max_net = 0.5                    # |sum of weights| in the group

# Exposure limits per underlying coin, as shares of equity (src/portfolio/exposure_limits.py). max_delta and
# max_scenario_loss are enforced on perp and spot targets; all four are checked on the held book (options included) and alerted.
# [risk.exposure]
# max_delta = 1.0              # delta in money at most 100% of equity
# max_vega_per_point = 0.01    # at most 1% of equity per implied-vol point
# max_short_gamma = 0.002      # a 1% move worsens the 1% delta by at most 0.2% of equity
# max_scenario_loss = 0.30     # the worst of -50%..+50% moves x vol shocks loses at most 30%

[instruments."kraken_futures:BTC/USD"]
kind = "perp"
max_leverage = 2.0
slippage_bps = 5

[instruments."kraken_futures:ETH/USD"]
kind = "perp"
max_leverage = 2.0
slippage_bps = 5

[[sleeves]]
id = "btc_ma_1d"
instrument = "kraken_futures:BTC/USD"
interval = "1d"
strategy = "moving_average_crossover"
params = { short_window = 4, long_window = 48 }
long_only = true
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "eth_ma_1d"
instrument = "kraken_futures:ETH/USD"
interval = "1d"
strategy = "moving_average_crossover"
params = { short_window = 4, long_window = 48 }
long_only = true
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "btc_keltner_ls"
instrument = "kraken_futures:BTC/USD"
interval = "1d"
strategy = "keltner_breakout"
params = { window = 40, atr_multiplier = 2.0 }
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "eth_keltner_ls"
instrument = "kraken_futures:ETH/USD"
interval = "1d"
strategy = "keltner_breakout"
params = { window = 40, atr_multiplier = 2.0 }
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

[[sleeves]]
id = "btc_ma_4h"
instrument = "kraken_futures:BTC/USD"
interval = "4h"
strategy = "moving_average_crossover"
params = { short_window = 8, long_window = 96 }
long_only = true
sizing = "vol_target"
sizing_params = { target_annual_vol = 0.5 }

# How orders are sent. "taker" (the default): every order is a market order. "maker_first": each order first rests at
# the touch as a post-only limit order (no spread, the lower maker fee); after maker_timeout_seconds what is left is
# cancelled and sent as a market order. Halts and the kill switch always use market orders. See docs/runbook.md.
# [execution]
# policy = "maker_first"
# maker_timeout_seconds = 300
